name: Generate Pac-Man contribution graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"
          player_style: "opportunistic"

      - name: Color contributions #e2342a
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          RED = "#e2342a"

          CONTRIBUTION_COLORS = {
              "#ebedf0",
              "#9be9a8",
              "#40c463",
              "#30a14e",
              "#216e39",
              "#161b22",
              "#0e4429",
              "#006d32",
              "#26a641",
              "#39d353",
          }

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text(encoding="utf-8")

              def replace_fill(match):
                  color = match.group(1).lower()

                  if color in CONTRIBUTION_COLORS:
                      return f'fill="{RED}"'

                  return match.group(0)

              svg = re.sub(
                  r'fill="(#[0-9a-fA-F]{6})"',
                  replace_fill,
                  svg
              )

              path.write_text(svg, encoding="utf-8")
              print(f"Colored contributions in {path} with {RED}")
          PY

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
