name: Generate Pac-Man contribution graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"
          player_style: "opportunistic"

      - name: Recolor graph (commits #e2342a, background #0a0805)
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          BG = "#0a0805"

          # Duotone: luminância -> gradiente entre #0a0805 e #e2342a
          # (ganho de 1.5 para os commits mais fortes chegarem perto de #e2342a)
          FILTER = (
              '<defs>'
              '<filter id="duotone" color-interpolation-filters="sRGB">'
              '<feColorMatrix type="matrix" values="'
              '0.2701 0.9088 0.0917 0 0.0392 '
              '0.0550 0.1851 0.0187 0 0.0314 '
              '0.0463 0.1556 0.0157 0 0.0196 '
              '0 0 0 1 0"/>'
              '</filter>'
              '</defs>'
              f'<rect width="100%" height="100%" fill="{BG}"/>'
              '<g filter="url(#duotone)">'
          )

          files = sorted(Path("dist").glob("*.svg"))
          if not files:
              raise RuntimeError("Nenhum SVG encontrado em dist/")

          for path in files:
              svg = path.read_text(encoding="utf-8")

              m = re.search(r"<svg[^>]*>", svg)
              if not m:
                  raise RuntimeError(f"SVG inválido: {path}")

              svg = svg[:m.end()] + FILTER + svg[m.end():]
              svg = svg.rsplit("</svg>", 1)[0] + "</g></svg>"

              path.write_text(svg, encoding="utf-8")
              print(f"Recolorido: {path}")

          # O filtro assume tema escuro como base: se existir a versão
          # dark, ela também substitui a versão light (fundo/células claros
          # ficariam vermelhos demais no duotone).
          for dark in Path("dist").glob("*-dark.svg"):
              light = dark.with_name(dark.name.replace("-dark", ""))
              light.write_text(dark.read_text(encoding="utf-8"), encoding="utf-8")
              print(f"{light} <- {dark}")
          PY

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
