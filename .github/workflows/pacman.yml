name: Generate Pac-Man contribution graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"
          player_style: "opportunistic"

      - name: Recolor graph (commits #e2342a, background #0a0805, empty cells gray)
        run: |
          python3 - <<'PY'
          import re
          import colorsys
          from collections import Counter
          from pathlib import Path

          BG = (0x0a, 0x08, 0x05)
          RED = (0xe2, 0x34, 0x2a)

          GAIN = 1.5          # commits mais fortes chegam perto de #e2342a
          GRAY_MIN = 0x2a     # cinza mínimo das células vazias (visível sobre o fundo)
          GRAY_MAX = 0x55     # cinza máximo

          def lum(r, g, b):
              return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255

          def is_gray(r, g, b):
              h, s, v = colorsys.rgb_to_hsv(r / 255, g / 255, b / 255)
              hue = h * 360
              if s < 0.25:
                  return True                      # cinza neutro
              if 170 <= hue <= 270 and s < 0.60:
                  return True                      # azul-acinzentado (ex.: #161b22)
              return False

          def recolor(r, g, b):
              l = lum(r, g, b)
              if is_gray(r, g, b):
                  v = round(l * 255)
                  v = min(max(v, GRAY_MIN), GRAY_MAX)
                  return (v, v, v)
              t = min(1.0, l * GAIN)
              return tuple(round(BG[i] + (RED[i] - BG[i]) * t) for i in range(3))

          HEX = re.compile(
              r"(?<!url\()#([0-9a-fA-F]{8}|[0-9a-fA-F]{6}|[0-9a-fA-F]{3})(?![0-9a-zA-Z_-])"
          )
          RGBA = re.compile(
              r"rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+)\s*)?\)"
          )

          def hex_sub(m):
              h = m.group(1)
              alpha = ""
              if len(h) == 3:
                  h = "".join(c * 2 for c in h)
              elif len(h) == 8:
                  h, alpha = h[:6], h[6:]
              r, g, b = (int(h[i:i + 2], 16) for i in (0, 2, 4))
              return "#{:02x}{:02x}{:02x}{}".format(*recolor(r, g, b), alpha)

          def rgba_sub(m):
              r, g, b = (int(x) for x in m.groups()[:3])
              a = m.group(4)
              nr, ng, nb = recolor(r, g, b)
              if a is None:
                  return f"rgb({nr},{ng},{nb})"
              return f"rgba({nr},{ng},{nb},{a})"

          files = sorted(Path("dist").glob("*.svg"))
          if not files:
              raise RuntimeError("Nenhum SVG encontrado em dist/")

          bg_rect = '<rect width="100%" height="100%" fill="#0a0805"/>'

          for path in files:
              svg = path.read_text(encoding="utf-8")

              m = re.search(r"<svg[^>]*>", svg)
              if not m:
                  raise RuntimeError(f"SVG inválido: {path}")

              # --- DEBUG: cores originais encontradas ---
              found = Counter(x.lower() for x in re.findall(r"#[0-9a-fA-F]{3,8}\b", svg))
              found.update(x.group(0) for x in RGBA.finditer(svg))
              print(f"--- Cores originais em {path} ---")
              for color, n in found.most_common(25):
                  print(f"{n:6d}  {color}")
              if re.search(r"hsla?\(", svg):
                  print("AVISO: o SVG usa hsl(), que este script não converte.")

              svg = HEX.sub(hex_sub, svg)
              svg = RGBA.sub(rgba_sub, svg)

              m = re.search(r"<svg[^>]*>", svg)
              svg = svg[:m.end()] + bg_rect + svg[m.end():]

              path.write_text(svg, encoding="utf-8")
              print(f"Recolorido: {path}")

          # A base é o tema escuro: a versão dark também substitui a light.
          for dark in Path("dist").glob("*-dark.svg"):
              light = dark.with_name(dark.name.replace("-dark", ""))
              light.write_text(dark.read_text(encoding="utf-8"), encoding="utf-8")
              print(f"{light} <- {dark}")
          PY

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
