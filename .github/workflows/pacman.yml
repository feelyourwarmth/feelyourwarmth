name: Generate Pac-Man contribution graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"
          player_style: "opportunistic"

      - name: Recolor graph (commits #e2342a, background #0a0805, empty cells gray)
        run: |
          python3 - <<'PY'
          import re
          import colorsys
          from pathlib import Path

          BG = "#0a0805"
          RED = (0xe2, 0x34, 0x2a)
          BG_RGB = (0x0a, 0x08, 0x05)

          GAIN = 1.6          # com 1.6 o commit mais forte vira exatamente #e2342a
          GRAY_MIN = 0x2a     # cinza mínimo das células vazias (visível sobre o fundo)
          GRAY_MAX = 0x55     # cinza máximo (textos)

          NAMED = {
              "yellow": "#e2342a",   # Pac-Man
              "red": "#ff7a6e",      # Pac-Man com power-up (um pouco mais claro)
          }

          def lum(r, g, b):
              return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255

          def is_gray(r, g, b):
              h, s, v = colorsys.rgb_to_hsv(r / 255, g / 255, b / 255)
              hue = h * 360
              if s < 0.25:
                  return True
              if 170 <= hue <= 270 and s < 0.60:
                  return True
              return False

          def recolor(r, g, b):
              l = lum(r, g, b)
              if is_gray(r, g, b):
                  v = min(max(round(l * 255), GRAY_MIN), GRAY_MAX)
                  return (v, v, v)
              t = min(1.0, l * GAIN)
              return tuple(round(BG_RGB[i] + (RED[i] - BG_RGB[i]) * t) for i in range(3))

          HEX = re.compile(r"(?<!url\()#([0-9a-fA-F]{8}|[0-9a-fA-F]{6}|[0-9a-fA-F]{3})(?![0-9a-zA-Z_-])")
          RGBA = re.compile(r"rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+)\s*)?\)")
          NAMED_RE = re.compile(r"(?<![\w#-])(" + "|".join(NAMED) + r")(?![\w-])")

          def hex_sub(m):
              h, alpha = m.group(1), ""
              if len(h) == 3:
                  h = "".join(c * 2 for c in h)
              elif len(h) == 8:
                  h, alpha = h[:6], h[6:]
              r, g, b = (int(h[i:i + 2], 16) for i in (0, 2, 4))
              return "#{:02x}{:02x}{:02x}{}".format(*recolor(r, g, b), alpha)

          def rgba_sub(m):
              r, g, b = (int(x) for x in m.groups()[:3])
              a = m.group(4)
              nr, ng, nb = recolor(r, g, b)
              return f"rgb({nr},{ng},{nb})" if a is None else f"rgba({nr},{ng},{nb},{a})"

          def attr_sub(m):
              # só mexe em atributos de cor e nas listas de animação (values="a;b;c")
              return NAMED_RE.sub(lambda n: NAMED[n.group(1)], m.group(0))

          ATTR = re.compile(r'\b(?:fill|stroke|values|from|to)="[^"]*"')
          BG_RECT = re.compile(r'(<rect\b[^>]*width="100%"[^>]*height="100%"[^>]*?fill=")[^"]*(")')

          files = sorted(Path("dist").glob("*.svg"))
          if not files:
              raise RuntimeError("Nenhum SVG encontrado em dist/")

          for path in files:
              svg = path.read_text(encoding="utf-8")
              if not re.search(r"<svg[^>]*>", svg):
                  raise RuntimeError(f"SVG inválido: {path}")

              svg = HEX.sub(hex_sub, svg)
              svg = RGBA.sub(rgba_sub, svg)
              svg = ATTR.sub(attr_sub, svg)

              # Fundo: o SVG original já traz um <rect 100%x100%> com a cor de fundo.
              # Troca a cor desse retângulo em vez de empilhar outro por baixo dele.
              svg, n = BG_RECT.subn(lambda m: m.group(1) + BG + m.group(2), svg)
              if n == 0:
                  m = re.search(r"<svg[^>]*>", svg)
                  svg = svg[:m.end()] + f'<rect width="100%" height="100%" fill="{BG}"/>' + svg[m.end():]

              path.write_text(svg, encoding="utf-8")
              print(f"Recolorido: {path} (retângulos de fundo ajustados: {n})")

          # A base é o tema escuro: a versão dark também substitui a light.
          for dark in Path("dist").glob("*-dark.svg"):
              light = dark.with_name(dark.name.replace("-dark", ""))
              light.write_text(dark.read_text(encoding="utf-8"), encoding="utf-8")
              print(f"{light} <- {dark}")
          PY

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
